 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review System with Success Message</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; background: #f4f4f9; color: #333; }
        .container { max-width: 600px; background: white; padding: 25px; border-radius: 8px; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); margin: auto; }
        input, textarea, select { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        input[type="file"] { border: none; padding: 5px 0; }
        button { background: #007BFF; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; width: 100%; }
        button:hover { background: #0056b3; }
        
        /* Success Message Box Style */
        #successBox { display: none; background: #d4edda; color: #155724; padding: 15px; border-radius: 5px; text-align: center; margin-bottom: 20px; border: 1px solid #c3e6cb; font-weight: bold; }

        .review-card { background: #f9f9f9; padding: 15px; margin-top: 12px; border-left: 4px solid #007BFF; border-radius: 4px; display: flex; align-items: flex-start; gap: 15px; }
        .review-card img { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; border: 1px solid #ddd; }
        .review-content { width: 100%; }
        .review-content h4 { margin: 0 0 5px 0; color: #007BFF; display: flex; justify-content: space-between; }
        .stars { color: #f39c12; font-size: 16px; }
        .review-content p { margin: 5px 0; }
        .review-content small { color: gray; font-size: 11px; }
        #loading { display: none; color: green; text-align: center; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Welcome to My Site!</h2>
    
    <!-- Success Message Box -->
    <div id="successBox">🎉 Your review submitted successfully!</div>

    <!-- Review Form -->
    <form id="reviewForm">
        <input type="text" id="name" placeholder="Aapka Naam" required>
        
        <label for="imageFile" style="font-size: 14px; color: #555;">Apni Photo Upload Karein (Optional):</label>
        <input type="file" id="imageFile" accept="image/*">

        <select id="rating" required>
            <option value="">Rating Chuniye (Stars)</option>
            <option value="⭐⭐⭐⭐⭐">5 - Bahut Badhiya (5 Star)</option>
            <option value="⭐⭐⭐⭐">4 - Accha Hai (4 Star)</option>
            <option value="⭐⭐⭐">3 - Theek Hai (3 Star)</option>
            <option value="⭐⭐">2 - Bura Hai (2 Star)</option>
            <option value="⭐">1 - Bahut Ganda (1 Star)</option>
        </select>
        
        <textarea id="review" placeholder="Apna Review Likhein..." rows="4" required></textarea>
        <button type="submit" id="submitBtn">Submit Review</button>
        <div id="loading">Review save ho raha hai...</div>
    </form>

    <hr style="margin: 25px 0;">

    <h3>Sabhi Users ke Reviews</h3>
    <div id="reviewsList">Reviews load ho rahe hain...</div>
</div>

<script>
    // Yahan apna Google Apps Script ka Web App URL paste karein
    const scriptURL = 'https://script.google.com/macros/s/AKfycbywUWj_R9f5nWqO6aydME5lMvcdID3HPTLsdVwypuGCBGmws7NeJM8y4GidhNFR4dJ-/exec';

    // 1. Visitor Tracking on Page Load
    window.addEventListener('load', () => {
        const visitorData = {
            type: 'visitor',
            time: new Date().toLocaleString(),
            device: navigator.userAgent
        };

        fetch(scriptURL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(visitorData)
        }).catch(err => console.log("Visitor tracking error:", err));

        fetchReviews();
    });

    // 2. Fetch Reviews from Google Sheet
    async function fetchReviews() {
        try {
            const response = await fetch(scriptURL);
            const reviews = await response.json();
            const reviewsList = document.getElementById('reviewsList');

            if (reviews.length === 0) {
                reviewsList.innerHTML = "<p>Abhi tak koi review nahi hai.</p>";
                return;
            }

            reviewsList.innerHTML = "";
            reviews.reverse().forEach(item => {
                let userImg = item.image && item.image.length > 50 
                    ? item.image 
                    : 'https://cdn-icons-png.flaticon.com/512/149/149071.png';

                const div = document.createElement('div');
                div.className = 'review-card';
                div.innerHTML = `
                    <img src="${userImg}" alt="User">
                    <div class="review-content">
                        <h4>${item.name} <span class="stars">${item.rating}</span></h4>
                        <p>${item.review}</p>
                        <small>Device/Time: ${item.time}</small>
                    </div>
                `;
                reviewsList.appendChild(div);
            });
        } catch (error) {
            console.error("Error fetching reviews:", error);
            document.getElementById('reviewsList').innerHTML = "<p style='color:red;'>Reviews load karne me error aaya.</p>";
        }
    }

    // 3. Submit Review Form with Success Notification
    const form = document.getElementById('reviewForm');
    const loading = document.getElementById('loading');
    const submitBtn = document.getElementById('submitBtn');
    const successBox = document.getElementById('successBox');

    form.addEventListener('submit', e => {
        e.preventDefault();
        submitBtn.style.display = 'none';
        loading.style.display = 'block';
        successBox.style.display = 'none'; // Pehle wale message ko hide rakhein

        const name = document.getElementById('name').value;
        const rating = document.getElementById('rating').value;
        const review = document.getElementById('review').value;
        const imageFile = document.getElementById('imageFile').files[0];

        if (imageFile) {
            const reader = new FileReader();
            reader.readAsDataURL(imageFile);
            reader.onload = function () {
                sendData(name, rating, review, reader.result);
            };
        } else {
            sendData(name, rating, review, 'https://cdn-icons-png.flaticon.com/512/149/149071.png');
        }
    });

    function sendData(name, rating, review, imageData) {
        const reviewData = {
            type: 'review',
            name: name,
            image: imageData,
            rating: rating,
            review: review,
            time: new Date().toLocaleString(),
            device: navigator.userAgent
        };

        fetch(scriptURL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(reviewData)
        })
        .then(() => {
            form.reset();
            loading.style.display = 'none';
            submitBtn.style.display = 'block';
            
            // Success message dikhana
            successBox.style.display = 'block';
            
            // 4 second baad success message apne aap gayab ho jayega
            setTimeout(() => {
                successBox.style.display = 'none';
            }, 4000);

            setTimeout(fetchReviews, 2000);
        })
        .catch(error => {
            console.error('Error!', error);
            alert('Kuch error aa gaya!');
            loading.style.display = 'none';
            submitBtn.style.display = 'block';
        });
    }
</script>

</body>
</html>
